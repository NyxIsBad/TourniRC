name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: release with v prefix tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: windows-x64
            archive: zip
          - runner: ubuntu-22.04
            artifact: linux-x64
            archive: tar.gz
          - runner: macos-15
            artifact: macos-arm64
            archive: zip
    runs-on: ${{ matrix.runner }}

    steps:
      - name: check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          npm ci
          npm run build
          python -m PyInstaller --noconfirm --clean TourniRC.spec

      - name: find release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 (received: $RELEASE_TAG)" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: pack windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/TourniRC `
            -DestinationPath "TourniRC-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"

      - name: linux
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C dist -czf "TourniRC-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" TourniRC

      - name: mac
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/TourniRC "TourniRC-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: TourniRC-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: publish!
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: download packaged build
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* --generate-notes --verify-tag
          fi
